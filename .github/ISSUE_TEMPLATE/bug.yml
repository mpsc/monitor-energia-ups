name: Bug report
description: Relatar um problema no firmware ou na interface
labels: [bug]
body:
  - type: textarea
    id: o-que
    attributes:
      label: O que aconteceu?
      description: Descreva o comportamento esperado x observado.
    validations:
      required: true
  - type: textarea
    id: reproduzir
    attributes:
      label: Como reproduzir?
      description: Passos, URL (/ , /config, /dados), logs do Serial (115200).
  - type: input
    id: versao
    attributes:
      label: Versão / placa
      description: Ex. v1.0.0, ESP32 DevKit, core 2.0.17.
